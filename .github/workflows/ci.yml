name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test-matrix:
    name: test (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-test.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test
        run: python -m pytest
      - name: Audit runtime, test and build dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict --disable-pip --no-deps -r requirements-test.lock -r requirements-build.lock

  test:
    name: test
    needs: test-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python tests and dependency audits
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Python tests and dependency audits did not all succeed ($MATRIX_RESULT)."
            exit 1
          fi
