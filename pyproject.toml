[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reforge-pixels"
version = "0.1.0"
description = "Offline RTX-accelerated image and video upscaler"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.13"
dependencies = [
  "Pillow==12.3.0",
  "pillow-heif==1.1.1",
  "PySide6==6.10.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[project.scripts]
reforge-pixels = "reforge_pixels.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reforge_pixels = ["resources/*.json", "resources/*.png", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
